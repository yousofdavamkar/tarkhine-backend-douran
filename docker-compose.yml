services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarkhine_migrate
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tarkhine_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push --skip-generate && npm run seed"
    restart: "no"
    networks:
      - tarkhine_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarkhine_backend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tarkhine_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      - COOKIE_SECRET=${COOKIE_SECRET:-your-cookie-secret-key-change-this}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOG_FORMAT=${LOG_FORMAT:-dev}
      - DEFAULT_PAGE=${DEFAULT_PAGE:-1}
      - DEFAULT_LIMIT=${DEFAULT_LIMIT:-10}
      - MAX_LIMIT=${MAX_LIMIT:-100}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/gif,application/pdf}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    command: npm start
    networks:
      - tarkhine_network

  postgres:
    image: postgres:15-alpine
    container_name: tarkhine_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tarkhine_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tarkhine_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - tarkhine_network

volumes:
  postgres_data:
    driver: local

networks:
  tarkhine_network:
    driver: bridge
